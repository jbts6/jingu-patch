name: Build

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write  # 这是创建 Release 所需的权限
    steps:
      - uses: actions/checkout@v4

      - uses: nuget/setup-nuget@v2

      - uses: microsoft/setup-msbuild@v1

      - name: Restore NuGet packages
        run: nuget restore JinguPatcher.sln

      - name: Build solution
        run: msbuild JinguPatcher.sln /p:Configuration=Release /verbosity:minimal

      - name: Package release
        shell: pwsh
        run: |
          $outDir = "release\JinguPatcher"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          New-Item -ItemType Directory -Force -Path "$outDir\Mods" | Out-Null

          Copy-Item "src\Patcher\bin\Release\JinguPatcher.exe" "$outDir\JinguPatcher.exe"
          Copy-Item "src\Patcher\bin\Release\Mono.Cecil.dll" "$outDir\Mono.Cecil.dll"
          Copy-Item "src\JinguMod\bin\Release\JinguMod.dll" "$outDir\JinguMod.dll"
          Copy-Item "src\Patch\bin\Release\JinguModPatch.dll" "$outDir\Mods\JinguModPatch.dll"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JinguPatcher
          path: release\JinguPatcher\
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/JinguPatcher/JinguPatcher.exe
            release/JinguPatcher/Mono.Cecil.dll
            release/JinguPatcher/JinguMod.dll
            release/JinguPatcher/Mods/JinguModPatch.dll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
