name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: nuget/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore JinguPatcher.sln

      - name: Build solution
        run: msbuild JinguPatcher.sln /p:Configuration=Release /verbosity:minimal

      - name: Package release
        shell: pwsh
        run: |
          $outDir = "release\JinguPatcher"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          New-Item -ItemType Directory -Force -Path "$outDir\Mods" | Out-Null

          Copy-Item "src\Patcher\bin\Release\JinguPatcher.exe" "$outDir\JinguPatcher.exe"
          Copy-Item "src\Patcher\bin\Release\Mono.Cecil.dll" "$outDir\Mono.Cecil.dll"
          Copy-Item "src\JinguMod\bin\Release\JinguMod.dll" "$outDir\JinguMod.dll"
          Copy-Item "src\Patch\bin\Release\JinguModPatch.dll" "$outDir\Mods\JinguModPatch.dll"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JinguPatcher
          path: release\JinguPatcher\
